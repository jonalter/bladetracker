<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/icon-rounded-280.png">
<meta property="og:site_name" content="BladeTracker">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/screenshot-blade-list.png">
<meta name="twitter:image:alt" content="BladeTracker ice hockey blade sharpening log screenshot">

<!-- iOS App -->
<meta name="apple-itunes-app" content="app-id=6755408995">
